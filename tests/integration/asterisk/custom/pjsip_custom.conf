; CI only: two "phones", 101 and 102, that Asterisk answers itself. Their
; contact is a second transport on this same Asterisk, where the loopback
; endpoint takes the call into [kig-ci-phone].

[transport-ci-loop]
type=transport
protocol=udp
bind=127.0.0.1:5070

[ci-phone](!)
type=endpoint
context=default
disallow=all
allow=g722,ulaw
direct_media=no

[101](ci-phone)
aors=101
callerid="CI Tone Phone" <101>
[101]
type=aor
contact=sip:tone@127.0.0.1:5070
qualify_frequency=0

[102](ci-phone)
aors=102
callerid="CI Recording Phone" <102>
[102]
type=aor
contact=sip:rec@127.0.0.1:5070
qualify_frequency=0

[ci-loop]
type=endpoint
transport=transport-ci-loop
context=kig-ci-phone
disallow=all
allow=g722,ulaw
direct_media=no
[ci-loop]
type=identify
endpoint=ci-loop
match=127.0.0.1
