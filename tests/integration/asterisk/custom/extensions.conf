; The add-on's default dialplan plus the kiosk intercom line, as in the docs,
; plus a test context the CI call starts in.
[general]
static=yes

[default]
include => parkedcalls
exten => 444,1,Park(,s)
exten => 555,1,ParkedCall(default,701)
; Kiosk intercom: 8xx rings a kiosk through Kiosk Intercom Gateway.
exten => _8XX,1,NoOp(Kiosk intercom)
 same => n,Stasis(kiosk-intercom,${EXTEN})
 same => n,Hangup()
exten => _X!,1,Dial(${PJSIP_DIAL_CONTACTS(${EXTEN})})

[parkedcallstimeout]
exten => s,1,Hangup()

; CI only: the "phone" side of the two test calls.
; kig-ci-tone plays 440 Hz at the kiosk; kig-ci-rec records what the kiosk says.
[kig-ci-tone]
exten => s,1,Answer()
 same => n,Playtones(440)
 same => n,Wait(6)
 same => n,Hangup()

[kig-ci-rec]
exten => s,1,Answer()
 same => n,Record(/tmp/kig-ci.wav,0,6,kq)
 same => n,Hangup()

; CI only: the far end of the test phones 101 (tone) and 102 (recording). They stay
; on the line: the kiosk side hangs up, since a BYE between this Asterisk's own two
; SIP ports is now and then lost and would leave the phone up.
[kig-ci-phone]
exten => tone,1,NoOp(KIGCI phone call from ${CALLERID(all)})
 same => n,Answer()
 same => n,Playtones(440)
 same => n,Wait(60)
 same => n,Hangup()
exten => rec,1,NoOp(KIGCI phone call from ${CALLERID(all)})
 same => n,Answer()
 same => n,Record(/tmp/kig-out.wav,0,60,kq)
 same => n,Hangup()
