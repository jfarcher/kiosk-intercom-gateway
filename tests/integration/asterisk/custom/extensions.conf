; The add-on's default dialplan plus the kiosk intercom line, as in the docs,
; plus a test context the CI call starts in.
[general]
static=yes

[default]
include => parkedcalls
exten => 444,1,Park(,s)
exten => 555,1,ParkedCall(default,701)
; Kiosk intercom: 8xx rings a kiosk through Kiosk Intercom Gateway.
exten => _8XX,1,NoOp(Kiosk intercom)
 same => n,Stasis(kiosk-intercom,${EXTEN})
 same => n,Hangup()
exten => _X!,1,Dial(${PJSIP_DIAL_CONTACTS(${EXTEN})})

[parkedcallstimeout]
exten => s,1,Hangup()

; CI only: the "phone" side of the two test calls.
; kig-ci-tone plays 440 Hz at the kiosk; kig-ci-rec records what the kiosk says.
[kig-ci-tone]
exten => s,1,Answer()
 same => n,Playtones(440)
 same => n,Wait(6)
 same => n,Hangup()

[kig-ci-rec]
exten => s,1,Answer()
 same => n,Record(/tmp/kig-ci.wav,0,6,kq)
 same => n,Hangup()
