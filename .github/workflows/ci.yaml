name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app image (amd64)
        run: >
          docker build
          --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:latest
          -t kiosk-intercom-gateway:test kiosk_intercom_gateway
      - name: Smoke test the image (default CMD, as the Supervisor runs it)
        run: |
          # The token must survive s6-overlay's environment reset, or the app
          # would run without Home Assistant and on a fallback port.
          docker run -d --name kig -e SUPERVISOR_TOKEN=ci-token -e KIG_PORT=8099 \
            -e KIG_KEY=test -e KIG_OPEN_WEB=1 -p 8099:8099 kiosk-intercom-gateway:test
          for i in $(seq 1 20); do curl -fs localhost:8099/api/kiosks && break; sleep 1; done
          curl -fs localhost:8099/api/kiosks | grep -q '"version"'
          docker logs kig 2>&1 | tee kig.log
          grep -q "status page on port 8099" kig.log
          ! grep -q "no Supervisor token" kig.log

  asterisk:
    # A real call through the Home Assistant Asterisk app's own image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Start Asterisk (ghcr.io/tech7fox/asterisk-hass-addon)
        run: |
          mkdir -p ast/asterisk
          cp tests/integration/asterisk/config.json ast/config.json
          cp -r tests/integration/asterisk/custom ast/asterisk/custom
          docker run -d --name ast --network host -t -v "$PWD/ast:/config" \
            ghcr.io/tech7fox/asterisk-hass-addon:latest
          for i in $(seq 1 90); do
            curl -fs -u kig:ci-secret http://127.0.0.1:8088/ari/asterisk/info >/dev/null && break
            sleep 2
          done
          curl -fsS -u kig:ci-secret http://127.0.0.1:8088/ari/asterisk/info | head -c 300; echo
      - name: Call a kiosk through the gateway
        run: python3 tests/integration/e2e.py http://127.0.0.1:8088 kig ci-secret
      - name: Check what Asterisk heard from the kiosk
        run: |
          echo "::notice title=recordings::$(docker exec ast sh -c 'ls -la /tmp/kig* /var/spool/asterisk/recording/ 2>&1' | tr '\n' ' ')"
          docker cp ast:/var/spool/asterisk/recording/kig-snoop.wav kig-snoop.wav || true
          docker cp ast:/tmp/kig-ci.wav kig-ci.wav
          # The snoop is the gateway's RTP as Asterisk received it; the second is the far side's Record().
          python3 tests/integration/e2e.py --recording kig-snoop.wav kig-ci.wav
      - name: Asterisk log
        if: always()
        run: |
          docker logs ast 2>&1 | tail -80
          lines=$(docker logs ast 2>&1 | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -E "WARNING|ERROR|Record|RECORD|kig|UnicastRTP|strict" \
            | grep -v -E "declined to load|LDAP|phoneprov|getnameinfo|users.conf|non-required" | tail -25)
          echo "::notice title=asterisk log::$(echo "$lines" | sed ':a;N;$!ba;s/\n/%0A/g')"
