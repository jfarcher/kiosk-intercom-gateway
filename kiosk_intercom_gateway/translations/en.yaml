configuration:
  intercom_key:
    name: Intercom key
    description: >-
      The kiosks' shared intercom key. Copy it from any kiosk under Settings,
      Intercom (the box with the key). Kiosks only read Ready once it matches.
  extra_kiosks:
    name: Extra kiosks
    description: >-
      Kiosks mDNS cannot reach, such as another VLAN: host or host:port of their
      remote admin (port 2324 by default). https://host:port for HTTPS admin.
  mdns:
    name: Discover kiosks over mDNS
    description: Finds kiosks with Find other kiosks on, the way kiosks find each other.
  probe_interval:
    name: Probe interval
    description: Seconds between identity checks of each kiosk.
  ari_url:
    name: Asterisk ARI address
    description: >-
      Where Asterisk's HTTP server answers. The Home Assistant Asterisk app
      listens on http://127.0.0.1:8088.
  ari_username:
    name: ARI username
    description: >-
      The user in Asterisk's ari.conf (see the app's Documentation tab). Empty
      leaves SIP calls off.
  ari_password:
    name: ARI password
  ari_app:
    name: Stasis app name
    description: The name the dialplan's Stasis() hands calls to. Default kiosk-intercom.
  extension_start:
    name: First kiosk extension
    description: >-
      Kiosks are numbered from here in the order they are first seen, and keep
      their number. 801 by default (700 to 703 are the Asterisk app's parking).
  ring_timeout:
    name: Ring timeout
    description: Seconds a kiosk may ring before the caller hears no answer.
  intercom_port:
    name: Intercom port
    description: Port kiosks answer calls on. Empty or 0 picks a free one.
  media_host:
    name: Call audio address
    description: >-
      Where Asterisk connects for call audio. 127.0.0.1 when Asterisk runs on
      this Home Assistant; this machine's LAN address when it runs elsewhere.
  log_level:
    name: Log level
