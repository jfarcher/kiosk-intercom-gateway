<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiosk Intercom Gateway</title>
<style>
  :root {
    --bg: #fafafa; --card: #fff; --fg: #1c1c1c; --muted: #6b6b6b; --line: #e3e3e3;
    --ok: #1b8a3a; --warn: #b26a00; --bad: #c62828; --idle: #8a8a8a; --accent: #03a9f4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --card: #1c1c1c; --fg: #e8e8e8; --muted: #9a9a9a; --line: #2e2e2e;
            --ok: #4cc26b; --warn: #f0a63a; --bad: #ef5350; --idle: #777; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
         background: var(--card); border: 1px solid var(--line); border-radius: 12px;
         padding: 12px 14px; margin-bottom: 16px; }
  .bar b { font-weight: 600; }
  .bar .sp { flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--fg);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .list { display: grid; gap: 10px; }
  .k { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
       display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
  .k .name { font-weight: 600; }
  .k .meta { color: var(--muted); font-size: 13px; grid-column: 1 / -1; overflow-wrap: anywhere; }
  .pill { justify-self: end; align-self: start; font-size: 12px; font-weight: 600; border-radius: 999px;
          padding: 2px 10px; border: 1px solid currentColor; white-space: nowrap; }
  .ready { color: var(--ok); } .dnd, .encryption, .key, .no_key { color: var(--warn); }
  .unreachable, .off { color: var(--bad); } .unknown, .offline { color: var(--idle); }
  .empty { color: var(--muted); text-align: center; padding: 32px 8px; }
  .warn { color: var(--warn); }
  .keycard { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
             padding: 14px; margin-bottom: 16px; }
  .keycard h2 { font-size: 16px; margin: 0 0 4px; }
  .keycard p { margin: 0 0 10px; color: var(--muted); }
  .keycard.need { border-color: var(--warn); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row input { flex: 1 1 240px; min-width: 0; font: inherit; color: var(--fg); background: var(--bg);
               border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .row input:focus { outline: none; border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .msg { margin-top: 8px; font-size: 13px; min-height: 1em; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 12px 14px; margin-bottom: 16px; }
  .card h2 { font-size: 16px; margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .card .line { color: var(--muted); font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--idle); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--accent); font-size: 14px; }
  .steps { margin: 8px 0 0; padding-left: 20px; }
  .steps li { margin: 0 0 12px; }
  .steps code, .k code { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .snip { position: relative; margin-top: 6px; }
  .snip pre { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
              padding: 10px 12px; overflow-x: auto; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .snip button { position: absolute; top: 6px; right: 6px; font-size: 12px; padding: 2px 8px; background: var(--card); }
  .ext { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); margin-right: 8px; }
  .calls { margin-top: 8px; display: grid; gap: 4px; font-size: 14px; }
  .calls .live { color: var(--ok); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Kiosk Intercom Gateway</h1>
  <p class="sub">Kiosk Satellite kiosks on the network, their extensions, and calls from SIP phones through Asterisk.</p>
  <div class="bar" id="bar">Loading…</div>
  <div class="keycard" id="keycard" hidden>
    <h2 id="keytitle">Intercom key</h2>
    <p>On any kiosk, open <b>Settings → Intercom</b> and copy the <b>Intercom key</b>, then paste it here.
       Every kiosk on the intercom shares it.</p>
    <form class="row" id="keyform" autocomplete="off">
      <input id="keyinput" type="password" placeholder="Paste the intercom key" spellcheck="false"
             autocapitalize="off" aria-label="Intercom key">
      <button type="button" id="keyshow">Show</button>
      <button type="submit" class="primary">Save</button>
      <button type="button" id="keycancel" hidden>Cancel</button>
    </form>
    <div class="msg" id="keymsg"></div>
  </div>
  <div class="card" id="asterisk">Loading…</div>
  <div class="list" id="list"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = (t) => { if (!t) return "never"; const s = Math.round(Date.now() / 1000 - t);
  return s < 60 ? `${s}s ago` : `${Math.round(s / 60)} min ago`; };

let keyOpen = false, keySet = false;
function showKeyCard() {
  const card = $("keycard");
  card.hidden = keySet && !keyOpen;
  card.classList.toggle("need", !keySet);
  $("keytitle").textContent = keySet ? "Change the intercom key" : "Add the intercom key";
  $("keycancel").hidden = !keySet;
}
$("keyshow").onclick = () => {
  const i = $("keyinput"); i.type = i.type === "password" ? "text" : "password";
  $("keyshow").textContent = i.type === "password" ? "Show" : "Hide";
};
$("keycancel").onclick = () => { keyOpen = false; $("keymsg").textContent = ""; showKeyCard(); };
$("keyform").onsubmit = async (e) => {
  e.preventDefault();
  const msg = $("keymsg"), key = $("keyinput").value.trim();
  if (!key) { msg.className = "msg err"; msg.textContent = "Paste the key first."; return; }
  msg.className = "msg"; msg.textContent = "Saving…";
  try {
    const res = await fetch("api/key", {method: "POST", headers: {"content-type": "application/json"},
                                        body: JSON.stringify({key})});
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "HTTP " + res.status);
    $("keyinput").value = "";
    keyOpen = false;
    msg.className = "msg ok";
    msg.textContent = data.saved ? `Saved. Fingerprint ${data.fingerprint}.` : data.note;
    await load();
  } catch (err) {
    msg.className = "msg err"; msg.textContent = "Not saved: " + err.message;
  }
};

const snippets = {};
function snip(id, text) {
  snippets[id] = text;
  return `<div class="snip"><pre>${esc(text)}</pre><button type="button" data-copy="${id}">Copy</button></div>`;
}
document.addEventListener("click", async (e) => {
  const id = e.target?.dataset?.copy;
  if (!id) return;
  try { await navigator.clipboard.writeText(snippets[id]); e.target.textContent = "Copied"; }
  catch { const r = document.createRange(); r.selectNodeContents(e.target.previousElementSibling);
          const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); e.target.textContent = "Selected"; }
  setTimeout(() => { e.target.textContent = "Copy"; }, 1500);
});
const pattern = (start) => { const t = String(start || 801); return "_" + t[0] + "X".repeat(t.length - 1); };
const since = (t) => { const s = Math.max(0, Math.round(Date.now() / 1000 - t));
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const ENDED = {ended: "ended", declined: "declined", busy: "kiosk busy", dnd: "do not disturb",
  no_answer: "no answer", unknown_kiosk: "no kiosk on that number", unavailable: "kiosk unavailable",
  failed: "connection failed"};
let setupOpen = null;

function renderAsterisk(a) {
  const configured = a.enabled, ok = configured && a.connected;
  const dot = ok ? "ok" : configured ? "bad" : "warn";
  const state = ok ? `Connected to Asterisk ${esc(a.asterisk_version)}`
    : configured ? `Not connected: ${esc(a.error || "connecting…")}` : "SIP calls are off: no ARI user set";
  const live = a.calls.map((c) => `<div><span class="live">● ${esc(c.state === "in_call" ? "In call" :
      c.state === "ringing" ? "Ringing" : "Connecting")}</span> ${esc(c.caller)} → ${esc(c.kiosk)}` +
      `${c.extension ? " (" + esc(c.extension) + ")" : ""} · ${since(c.since)}</div>`).join("");
  const recent = a.history.slice(-5).reverse().map((c) => `<div class="line">${esc(c.caller || "A caller")} → ` +
      `${esc(c.kiosk || "?")}: ${esc(ENDED[c.reason] || c.reason)} · ${ago(c.at)}</div>`).join("");
  const user = a.username || "kiosk-gateway", app = a.app || "kiosk-intercom", pat = pattern(a.extension_start);
  const ari = `[general]\nenabled = yes\n\n[${user}]\ntype = user\nread_only = no\npassword = CHOOSE-A-PASSWORD\n`;
  const ext = `; Kiosk intercom: ${pat.slice(1)} rings a kiosk through Kiosk Intercom Gateway.\n` +
    `exten => ${pat},1,NoOp(Kiosk intercom)\n same => n,Stasis(${app},\${EXTEN})\n same => n,Hangup()\n`;
  if (setupOpen === null) setupOpen = !ok;
  const dir = "/addon_configs/b35499aa_asterisk/asterisk";
  $("asterisk").innerHTML = `
    <h2><span class="dot ${dot}"></span>Asterisk</h2>
    <div class="line">${state}${ok ? ` · app <code>${esc(app)}</code> at ${esc(a.ari_url)}` : ""}</div>
    ${live || recent ? `<div class="calls">${live}${recent}</div>` : ""}
    <details id="setup" ${setupOpen ? "open" : ""}><summary>Set up Asterisk for kiosk calls</summary>
    <ol class="steps">
      <li>Install the <b>Asterisk</b> app (TECH7Fox) and start it once, so it creates its config folders.</li>
      <li>Create <code>${dir}/custom/ari.conf</code> (with the File editor or Samba app):${snip("ari", ari)}</li>
      <li>Copy <code>${dir}/default/extensions.conf</code> to <code>${dir}/custom/extensions.conf</code> and add these
          lines in its <code>[default]</code> section, above the <code>_X!</code> line:${snip("ext", ext)}</li>
      <li>Restart the Asterisk app.</li>
      <li>In this app's <b>Configuration</b>, set <b>ARI username</b> to <code>${esc(user)}</code> and
          <b>ARI password</b> to the password you chose, save and restart.</li>
      <li>Dial a kiosk's extension from any phone on Asterisk. The numbers are listed below.</li>
    </ol></details>`;
  $("setup").ontoggle = (e) => { setupOpen = e.target.open; };
}

async function load() {
  try {
    const res = await fetch("api/kiosks", {cache: "no-store"});
    const data = await res.json();
    const g = data.gateway, ks = data.kiosks;
    const ready = ks.filter((k) => k.status === "ready").length;
    $("bar").innerHTML =
      `<span><b>${ready}</b> of ${ks.length} ready</span>` +
      `<span>Key: ${g.key_fingerprint ? `<b>${esc(g.key_fingerprint)}</b>` : '<b class="warn">not set</b>'}</span>` +
      `<span>mDNS: <b>${g.discovery ? "on" : "off"}</b></span>` +
      `<span>Home Assistant: <b>${g.home_assistant ? "connected" : "off"}</b></span>` +
      `<span class="sp"></span><span>v${esc(g.version)}</span>` +
      (g.key_fingerprint ? `<button id="changekey">Change key</button>` : "") +
      `<button id="probe">Probe now</button>`;
    keySet = !!g.key_fingerprint;
    showKeyCard();
    if ($("changekey")) $("changekey").onclick = () => { keyOpen = true; showKeyCard(); $("keyinput").focus(); };
    $("probe").onclick = async () => { await fetch("api/probe", {method: "POST"}); setTimeout(load, 1500); };
    if (g.asterisk) renderAsterisk(g.asterisk);
    $("list").innerHTML = ks.length ? ks.map((k) => `
      <div class="k">
        <span class="name">${k.extension ? `<span class="ext">${esc(k.extension)}</span>` : ""}${esc(k.name)}</span>
        <span class="pill ${k.status}">${esc(k.status_text)}</span>
        <span class="meta">${esc(k.address)}:${k.admin_port}${k.area ? " · " + esc(k.area) : ""}` +
        `${k.version ? " · v" + esc(k.version) : ""} · ${k.source === "manual" ? "added by address" : "mDNS"}` +
        `${k.ha_intercom_state ? " · HA: " + esc(k.ha_intercom_state) : ""} · probed ${ago(k.probed_at)}</span>
      </div>`).join("")
      : `<div class="empty">No kiosks yet. Kiosks announce themselves when <b>Remote management</b> and
         <b>Find other kiosks</b> are on. Kiosks on another network can be added by address in the app's configuration.</div>`;
  } catch (e) {
    $("bar").textContent = "Could not reach the gateway: " + e;
  }
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
