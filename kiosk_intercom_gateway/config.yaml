name: Kiosk Intercom Gateway
version: "0.1.2"
slug: kiosk_intercom_gateway
description: Tracks Kiosk Satellite intercom kiosks, groundwork for a SIP gateway
url: https://github.com/jfarcher/kiosk-intercom-gateway
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
# mDNS discovery needs the host's network; so will the intercom and SIP media.
host_network: true
ingress: true
# 0: the Supervisor picks a free host port (host_network shares the host's ports).
ingress_port: 0
hassio_api: true
panel_icon: mdi:phone-voip
panel_title: Kiosk Intercom
homeassistant_api: true
stage: experimental
options:
  intercom_key: ""
  extra_kiosks: []
  mdns: true
  probe_interval: 30
  log_level: info
schema:
  intercom_key: password?
  extra_kiosks:
    - str
  mdns: bool
  probe_interval: int(10,600)
  log_level: list(debug|info|warning|error)
